<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#007acc" />
  <title>SomaFMcore: System Ready. Music On.</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/pwa-icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>

  <style>
    :root{
      --bg-color: #121212;
      --fg-color: #cccccc;
      --prompt-user: #87d75f;
      --prompt-path: #5f87d7;
      --cmd-color: #fce94f;
      --cursor: #cccccc;
      --status-bg: #007acc;
      --status-fg: #ffffff;
      --vis-color: #4ec9b0;
      --track-bg: #d7005f;
      --track-fg: #ffffff;
      --status-h: 112px;
      --term-max-width: 800px;
    }
    
    *{ box-sizing:border-box; }
    
    html {
      background-color: #050505; 
    }
    
    body{
      background-color:var(--bg-color);
      color:var(--fg-color);
      font-family:"Ubuntu Mono", Consolas, monospace;
      font-size:16px;
      margin:0; padding:0;
      height:100vh; height:100dvh;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    @media (min-width: 801px) {
      body {
        max-width: var(--term-max-width);
        margin: 0 auto;
        border-left: 1px solid #333;
        border-right: 1px solid #333;
        box-shadow: 0 0 40px rgba(0,0,0,0.55);
        position: relative;
      }
    }

    #terminal{
      flex:1;
      padding:10px 12px;
      padding-top:max(15px, env(safe-area-inset-top));
      padding-bottom:calc(var(--status-h) + 45px); 
      overflow-y:auto;
      overflow-x:hidden;
      word-wrap:break-word;
      display:flex;
      flex-direction:column;
      -webkit-overflow-scrolling:touch;
    }

    #terminal::-webkit-scrollbar{ width:6px; }
    #terminal::-webkit-scrollbar-track{ background:var(--bg-color); }
    #terminal::-webkit-scrollbar-thumb{ background:#333; }

    .line{ 
      line-height:1.3; 
      min-height:18px; 
      margin-bottom: 2px;
      display: block;
    }
    
    .c-user { color: var(--prompt-user); font-weight:bold; }
    .c-path { color: var(--prompt-path); font-weight:bold; }
    .c-cmd  { color: var(--cmd-color); }
    .c-dim  { color: #666; }
    .c-group { color: var(--prompt-path); font-weight:bold; margin-top: 10px; opacity: .85; }
    .c-err  { color: #f44747; }
    .c-vis  { color: var(--vis-color); font-weight:bold; }

    .stations-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0 10px;
    }
    .station-item {
        white-space: nowrap;
    }
    .station-current {
      background-color: var(--cmd-color);
      color: #111;
      font-weight: bold;
      padding: 0 4px;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(252, 233, 79, 0.45);
    }
    .station-current .c-dim { color: #333; }

    .track-highlight {
      background-color: var(--track-bg);
      color: var(--track-fg);
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 2px;
      display: inline-block;
      margin: 4px 0;
      box-shadow: 0 0 5px rgba(215, 0, 95, 0.4);
    }

    .clickable{ cursor:pointer; }
    .clickable:hover{ background-color:#333; color:#fff; text-decoration:underline; }
    .cmd-link{ cursor:pointer; }
    .cmd-link:hover{ background-color:#333; color:#fff; text-decoration:underline; }
    .tv-focus {
      outline: 2px solid var(--cmd-color);
      outline-offset: 2px;
      background-color: rgba(252, 233, 79, 0.16);
      color: #fff;
      text-decoration: none;
    }
    .station-current.tv-focus {
      outline-color: #fff;
      background-color: var(--cmd-color);
      color: #111;
    }
    .station-current,
    .station-current:hover,
    .station-current:focus,
    .station-current:active {
      background-color: var(--cmd-color);
      color: #111;
      text-decoration: none;
    }
    .station-current .c-dim,
    .station-current:hover .c-dim,
    .station-current:focus .c-dim,
    .station-current:active .c-dim { color: #333; }

    #input-line{
      position: fixed;
      bottom: calc(var(--status-h) + env(safe-area-inset-bottom));
      left: 0;
      width: 100%;
      background-color: var(--bg-color);
      padding: 6px 12px 8px 12px;
      display:flex;
      align-items:center;
      z-index: 10;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    #prompt-span{ margin-right:8px; white-space:nowrap; flex-shrink:0; }
    #input-wrapper{ position:relative; flex:1; display:flex; align-items:center; overflow:hidden; }
    #cmd-input{
      position:absolute; top:0; left:0; width:100%; height:100%;
      opacity:0; border:none; padding:0; margin:0; cursor:default;
    }
    #cursor{
      display:inline-block; width:9px; height:1.1em;
      background-color:var(--cursor);
      animation:blink 1s step-end infinite;
      vertical-align:text-bottom; margin-left: 1px;
    }
    @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0;} }

    #status-bar{
      position:fixed; bottom:0; left:0; width:100%;
      background-color:var(--status-bg);
      color:var(--status-fg);
      display:flex; flex-direction:column;
      height:calc(var(--status-h) + env(safe-area-inset-bottom));
      padding-bottom:env(safe-area-inset-bottom);
      font-size:13px; z-index:9999;
      box-shadow:0 -4px 20px rgba(0,0,0,0.6);
      user-select:none; -webkit-user-select:none;
    }

    #status-info-row {
      flex:1; display:flex; align-items:center; justify-content:space-between;
      padding:0 12px; background: rgba(0,0,0,0.15);
      border-bottom:1px solid rgba(255,255,255,0.1);
    }
    #info-track-container { flex:1; overflow:hidden; margin-right:10px; display:flex; flex-direction:column; justify-content:center; }
    #info-label { font-size:10px; opacity:0.7; text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }
    #info-track { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:bold; font-size:14px; }
    #info-meta { text-align:right; font-size:12px; min-width:64px; display:flex; align-items:center; justify-content:flex-end; }

    #status-telemetry-row {
      height:22px; display:flex; align-items:center;
      padding:0 12px; background:rgba(0,0,0,0.24);
      border-bottom:1px solid rgba(255,255,255,0.1);
      font-size:11px; font-weight:bold; letter-spacing:0.5px;
      color:rgba(255,255,255,0.86); white-space:nowrap; overflow:hidden;
    }
    #status-telemetry-row span { overflow:hidden; text-overflow:ellipsis; }

    /* --- NEW PIXEL VISUALIZER STYLE --- */
    #vis-canvas {
      width: 64px;
      height: 24px;
      image-rendering: pixelated; 
      opacity: 0.9;
    }

    #status-controls-row {
      height:46px; display:flex; align-items:center; justify-content:space-evenly;
      padding:0 5px; background: rgba(0,0,0,0.05);
    }

    .s-btn{
      cursor:pointer; padding:10px 18px; border-radius:2px;
      transition:all 0.1s; text-align:center; white-space:nowrap;
      font-weight:bold; font-size:13px; border:1px solid rgba(255,255,255,0.1);
      flex:1; margin:0 4px; max-width:100px;
      background:transparent; color:inherit; font-family:inherit;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .s-btn:focus-visible{ outline:1px solid rgba(255,255,255,0.8); outline-offset:2px; }
    .s-btn:active{ background-color:rgba(255,255,255,0.3); transform:translateY(1px); }
    .s-btn-icon{ font-size:14px; line-height:1; opacity:0.9; }

    #vol-popup {
      position:absolute; bottom:calc(55px + env(safe-area-inset-bottom));
      left:50%; transform:translateX(-50%);
      background:#111; border:1px solid #555; padding:12px 18px;
      display:none; align-items:center; gap:10px;
      box-shadow:0 4px 15px rgba(0,0,0,0.8); z-index:10000;
      border-radius: 4px;
    }
    #vol-popup.show { display:flex; }
    #mute-btn {
      cursor:pointer; border:1px solid #555; background:#181818; color:#fff;
      font-family:inherit; font-size:12px; font-weight:bold;
      padding:6px 9px; border-radius:2px;
    }
    #mute-btn.active { background:var(--track-bg); border-color:rgba(255,255,255,0.35); }
    input[type=range] { -webkit-appearance:none; width:140px; height:4px; background:#555; outline:none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:var(--status-bg); cursor:pointer; border:2px solid #fff; border-radius:50%; }

    @keyframes fadeOut { 0%{opacity:1;} 100%{opacity:0;} }
    .copied-anim { animation:fadeOut 1.5s forwards; color:#87d75f !important; }

    @media (max-width:600px){
      body{ font-size:15px; }
      .s-btn{ padding:10px 5px; font-size:12px; }
    }

    @media (min-width: 801px) {
      #status-bar, #input-line {
        left: 50%;
        width: var(--term-max-width);
        max-width: var(--term-max-width);
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>

  <div id="terminal">
    <div class="line c-user">SomaFMcore: System Ready. Music On.</div>
    <div class="line c-dim">Kernel: WebAudio / Canvas / HLS</div>
    <div class="line c-dim">----------------------------------------</div>
    <div id="output"></div>
  </div>

  <div id="input-line">
    <span id="prompt-span">
      <span class="c-user">user@somafm</span><span class="c-dim">:</span><span class="c-path" id="path-display">~</span><span class="c-dim">$</span>
    </span>
    <div id="input-wrapper">
      <span id="typed-display" class="c-cmd"></span><span id="cursor"></span>
      <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <div id="status-bar">
    <div id="status-info-row">
      <div id="info-track-container" class="clickable" onclick="copyTrackFromStatus(this)">
        <div id="info-label">NOW PLAYING</div>
        <div id="info-track">Waiting for signal...</div>
      </div>
      <div id="info-meta">
        <canvas id="vis-canvas" width="32" height="12"></canvas>
      </div>
    </div>

    <div id="status-telemetry-row">
      <span id="status-telemetry">NO STREAM | OFFLINE | UP --:-- | VOL 80</span>
    </div>

    <div id="status-controls-row">
      <!-- Buttons injected by JS -->
    </div>

    <div id="vol-popup">
      <span style="color:#aaa; font-size:12px;">VOL</span>
      <input type="range" id="vol-slider" min="0" max="100" value="80">
      <span id="vol-val" style="color:#fff; font-size:12px; width:30px; text-align:right;">80%</span>
      <button type="button" id="mute-btn" onclick="toggleMute(event)">MUTE</button>
    </div>
  </div>

  <audio id="audio-player" crossorigin="anonymous" referrerpolicy="no-referrer"></audio>

  <script>
    // --- DATA ---
    const SOMA_CHANNELS_API = "https://api.somafm.com/channels.json";
    const IS_ANDROID_APP = !!(
      (window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === "android")

    );

    function setTvFocus(nextIndex){
      const items = getTvFocusables();
      clearTvFocus();
      if(!items.length) {
        return null;
      }
      tvFocusIndex = ((nextIndex % items.length) + items.length) % items.length;
      const el = items[tvFocusIndex];
      el.classList.add("tv-focus");
      el.scrollIntoView({ block:"nearest", inline:"nearest" });
      return el;
    }

    function moveTvFocus(delta){
      const items = getTvFocusables();
      if(!items.length) return;
      if(tvFocusIndex < 0) {
        const activeIndex = items.findIndex(el => el.classList.contains("station-current"));
        setTvFocus(activeIndex >= 0 ? activeIndex : 0);
        return;
      }
      setTvFocus(tvFocusIndex + delta);
    }

    function moveTvFocusVertical(direction){
      const items = getTvFocusables();
      if(!items.length) return;
      if(tvFocusIndex < 0 || !items[tvFocusIndex]) {
        const activeIndex = items.findIndex(el => el.classList.contains("station-current"));
        setTvFocus(activeIndex >= 0 ? activeIndex : 0);
        return;
      }

      const current = items[tvFocusIndex];
      const currentRect = current.getBoundingClientRect();
      const currentX = currentRect.left + currentRect.width / 2;
      const currentY = currentRect.top + currentRect.height / 2;
      const rowGap = Math.max(10, currentRect.height * 0.65);

      const ranked = items
        .map((el, index) => {
          const rect = el.getBoundingClientRect();
          const x = rect.left + rect.width / 2;
          const y = rect.top + rect.height / 2;
          return {
            index,
            dy: y - currentY,
            score: Math.abs(y - currentY) * 4 + Math.abs(x - currentX)
          };
        })
        .filter(item => direction > 0 ? item.dy > rowGap : item.dy < -rowGap)
        .sort((a, b) => a.score - b.score);

      if(ranked.length) {
        setTvFocus(ranked[0].index);
        return;
      }

      setTvFocus(tvFocusIndex + direction * 5);
    }

    function activateTvFocus(){

      const m = lower.match(/-(\d+)-(aac|mp3)/);
      if(m) return `${m[2].toUpperCase()}${m[1]}`;
      if(lower.includes("aac")) return "AAC";
      if(lower.includes("mp3")) return "MP3";
      return "STREAM";
    }

    function formatUptime(){
      if(!playbackStartedAt) return "00:00";
      const total = Math.max(0, Math.floor((Date.now() - playbackStartedAt) / 1000));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      if(h > 0) return `${h}:${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`;
      return `${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`;
    }

    // --- VISUALIZER LOGIC ---
    function initAudioContext() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64; 
      analyser.smoothingTimeConstant = 0.8;
      
      const bufferLength = analyser.frequencyBinCount;
      visDataArray = new Uint8Array(bufferLength);

      try {
        sourceNode = audioCtx.createMediaElementSource(audioPlayer);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch(e) {
        console.warn("Audio Context Error (CORS likely):", e);
      }
    }

    function drawVisualizer() {
      if (!isVisRunning) return;
      requestAnimationFrame(drawVisualizer);
      
      const canvas = document.getElementById("vis-canvas");
      if(!canvas) return;
      const ctx = canvas.getContext("2d");
      
      if(analyser) analyser.getByteFrequencyData(visDataArray);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const w = canvas.width;
      const h = canvas.height;
      const cols = VIS_COLS; 
      const colW = Math.floor(w / cols);
      const gap = 1;

      for (let i = 0; i < cols; i++) {
        // Skip lowest frequencies (0-2) to avoid DC offset/hum
        const dataIndex = Math.floor(i + 2); 
        const value = visDataArray ? visDataArray[dataIndex] || 0 : 0;
        
        // Scale height
        const percent = value / 255;
        const barHeight = Math.floor(percent * h);
        
        for (let y = 0; y < barHeight; y++) {
          // Gradient Logic (pixel coordinates are inverted)
          // y=0 is bottom visually here
          if (y < 4) ctx.fillStyle = "#4ec9b0";       // Teal
          else if (y < 8) ctx.fillStyle = "#fce94f";  // Yellow
          else ctx.fillStyle = "#d7005f";             // Red/Pink

          // Draw pixel
          ctx.fillRect(i * colW, h - 1 - y, colW - gap, 1); 
        }
      }
    }

      if(!e.target.closest("#vol-popup") && !e.target.closest(".s-btn")) volPopup.classList.remove("show");
    });

    // --- COPY ---
    async function copyToClip(text){
      if(!text) return;
      try { await navigator.clipboard.writeText(text); return true; } 
      catch { 
        const t = document.createElement("textarea"); t.value=text; 
        document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t);
        return true;
      }
    }
    window.copyTrack = function(el){
      const txt = el.dataset.track;
      if(txt) copyToClip(txt);
    };
    window.copyTrackFromStatus = async function(el){
      const track = infoTrack.dataset.track;
      if(!track) return;
      await copyToClip(track);
      
      const orig = infoTrack.innerText;
      infoTrack.classList.add("copied-anim");
      infoTrack.innerText = "COPIED TO CLIPBOARD";
      setTimeout(()=>{
        infoTrack.innerText = orig;
        infoTrack.classList.remove("copied-anim");
      }, 1500);
    };

    // --- LOGIC ---
    window.uiExec = function(cmd){
      inputField.blur();
      handleCommand(cmd, true);
    };

    function execInput(){
      const cmd = inputField.value;
      inputField.value = "";
      typedDisplay.innerText = "";
      printPromptLog(cmd);
      handleCommand(cmd, false);
      scrollToBottom();
    }

    function handleCommand(raw, fromUI){
      const cmd = raw.trim().toLowerCase();
      if(!cmd) return;

      const num = parseInt(cmd, 10);
      if(!isNaN(num)){
        if(stations[num-1]) {
          if(fromUI) clearStationTvFocus();
          playStation(num-1);
        }
        else {
          enterPromptState();
          print(`bash: ${escapeHtml(cmd)}: frequency index out of range`, "c-err");
        }
        return;
      }

      if (cmd === "cls" || cmd === "clean") {
        outputDiv.innerHTML = "";
        renderList({ focusCurrentStation: false, scrollBottom: true });
        return;
      }

      if (cmd === "help" || cmd === "man") {
        enterPromptState();
        printHelp();
        return;
      }

      if (cmd === "debug") {
        debugMode = !debugMode;
        enterPromptState();
        print(`debug: ${debugMode ? "on" : "off"}`, "c-dim");
        if(debugMode) logAudioDebug("snapshot");
        return;
      }

      if (cmd === "vol" || cmd === "volume") {
        enterPromptState();
        volPopup.classList.toggle("show");
        updateVolumeUi();
        print(`Volume gate: ${isMuted ? "MUTE" : Math.round(volume * 100) + "%"}.`, "c-dim");
        return;
      }
      
      if (cmd === "home" || cmd === "back" || cmd === "esc") {
        renderList({ focusCurrentStation: false, scrollBottom: true });
        return;
      }

      if (cmd === "last" || cmd === "resume") {
        playLastStation();
        return;
      }

      if (cmd === "random" || cmd === "rnd") {
        playRandomStation();
        return;
      }
      
      if (cmd === "stop") {
        if(!hasActivePlayback()) return;
        userPausedPlayback = false;
        stopPlayback();
        enterPromptState();
        print("Signal stopped.", "c-dim");
        return;
      }

      if (cmd === "mute" || cmd === "unmute") {
        setMuted(cmd === "mute" ? !isMuted : false, true);
        return;
      }
      
      if (cmd === "space" || cmd === "pause") {
        if(!hasActivePlayback()) return;
        enterPromptState();
        if(audioPlayer.paused) {
          userPausedPlayback = false;
          setStreamState("CONNECTING");
          audioPlayer.play().then(() => startRadioKeepAlive()).catch(() => {});
          if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
          isVisRunning = true;
          drawVisualizer();
          setStreamState("ONLINE");
          print("Signal resumed.", "c-dim");
        } else {
          userPausedPlayback = true;
          stopRadioKeepAlive();
          audioPlayer.pause();
          isVisRunning = false;
          setStreamState("PAUSED");
          print("Signal paused.", "c-dim");
        }
        updateStatus();
        return;
      }

      enterPromptState();
      print(`bash: ${escapeHtml(cmd)}: command not found`, "c-err");
    }

    function cmdLink(cmd, label=cmd){
      return `<span class="cmd-link c-cmd" role="button" onclick="uiExec('${escapeAttr(cmd)}')">${escapeHtml(label)}</span>`;
    }

    function printHelp(){
      print(`<span class="c-path">man somafmcore</span>`, "c-path");
      print(`<span class="c-cmd">[number]</span> play station by index`);
      print(`${cmdLink("space")} / ${cmdLink("pause")} play / pause`);
      print(`${cmdLink("random")} / ${cmdLink("rnd")} play random station`);
      print(`${cmdLink("last")} / ${cmdLink("resume")} resume last station`);
      print(`${cmdLink("mute")} / ${cmdLink("unmute")} toggle audio mute`);
      print(`${cmdLink("vol")} / ${cmdLink("volume")} show volume gate`);
      print(`${cmdLink("home")} / ${cmdLink("back")} / ${cmdLink("esc")} show station list without stopping`);
      print(`${cmdLink("stop")} stop playback`);
      print(`${cmdLink("cls")} / ${cmdLink("clean")} clear terminal and list stations`);
      print(`${cmdLink("help")} / ${cmdLink("man")} show this manual`);
      print(`${cmdLink("debug")} toggle audio event log`);
    }

    // --- DATA FETCHING ---
    async function loadStations(){
      try{
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), 3000); 
        
        const r = await fetch(SOMA_CHANNELS_API, { signal: controller.signal });
        clearTimeout(id);
        
        const d = await r.json();
        const loaded = d.channels.map(ch => ({
          id: ch.id,
          name: ch.title,
          description: ch.description || "",
          genre: ch.genre || "",
          source: "somafm",
          streamUrl: getBestStream(ch.playlists)
        })).sort((a,b)=>a.name.localeCompare(b.name));
        
        if(loaded.length > 0) return loaded.concat(EXTRA_STATIONS);
        throw new Error("No data");
      }catch(e){
        return EXTENDED_STATIONS
          .map(st => ({ ...st, source:"somafm", streamUrl: IS_ANDROID_APP ? st.streamUrl.replace("-128-aac", "-128-mp3") : st.streamUrl }))
          .sort((a,b)=>a.name.localeCompare(b.name))
          .concat(EXTRA_STATIONS);
      }
    }

    function getBestStream(pls){
      if(!Array.isArray(pls)) return "";
      const p = IS_ANDROID_APP
        ? (pls.find(x => x.format === "mp3") || pls[0])
        : (pls.find(x => x.url?.includes("128-aac")) || pls[0]);
      return p?.url || "";
    }

    function renderList(options={}){
      const { focusCurrentStation = true, scrollBottom = false } = options;
      appState = STATELIST;
      updatePathDisplay();
      
      print(`<span class="c-path">frequencies@somafm</span>: listing available uplinks...`, "c-path");
      
      let html = `<div class="stations-grid">`;
      stations.forEach((st, i) => {
        if(st.source === "external") return;
        const num = (i+1).toString().padStart(2,"0");
        const activeClass = currentStation && currentStation.id === st.id ? " station-current" : "";
        html += `<div class="station-item clickable${activeClass}" data-station-id="${escapeAttr(st.id)}" onclick="uiExec('${i+1}')"><span class="c-dim">${num}</span> ${escapeHtml(st.name)}</div>`;
      });
      html += `</div>`;
      print(html);

      const externalStations = stations
        .map((st, i) => ({ st, i }))
        .filter(item => item.st.source === "external");
      if(externalStations.length){
        print(`<span class="c-path">external@radio</span>: listing extra uplinks...`, "c-path");
        let curGroup = null;
        let extraHtml = "";
        externalStations.forEach(({ st, i }) => {
          const group = externalGroupLabel(st.id, st.genre);
          if(group !== curGroup){
            if(extraHtml) extraHtml += `</div>`;
            extraHtml += `<div class="c-dim c-group">${escapeHtml(group)}</div><div class="stations-grid">`;
            curGroup = group;
          }
          const num = (i+1).toString().padStart(2,"0");
          const activeClass = currentStation && currentStation.id === st.id ? " station-current" : "";
          extraHtml += `<div class="station-item clickable${activeClass}" data-station-id="${escapeAttr(st.id)}" onclick="uiExec('${i+1}')"><span class="c-dim">${num}</span> ${escapeHtml(st.name)}</div>`;
        });
        if(extraHtml) extraHtml += `</div>`;
        print(extraHtml);
      }
      refreshStationHighlight();
      updateStatus();
      requestAnimationFrame(() => {
        if(scrollBottom) scrollToBottom();
        if(focusCurrentStation) {
          const items = getTvFocusables();
          const activeIndex = items.findIndex(el => el.classList.contains("station-current"));
          if(activeIndex >= 0) setTvFocus(activeIndex);
        } else {
          clearTvFocus();
        }
        if(scrollBottom) scrollToBottom();
      });
    }

    function printLastStationHint(){
      const lastStation = getStationById(getLastStationId());
      if(!lastStation) return;
      print(
        `last signal: <span class="c-vis">${escapeHtml(lastStation.name)}</span> ` +
        `<span class="clickable c-cmd" onclick="uiExec('last')">[continue]</span>`,
        "c-dim"
      );
    }

    function playLastStation(){
      const idx = findStationIndexById(getLastStationId());
      if(idx < 0) {
        enterPromptState();
        print("No last signal stored.", "c-dim");
        return;
      }
      playStation(idx);
    }

    function playRandomStation(){
      if(!stations.length) return;
      let idx = Math.floor(Math.random() * stations.length);
      if(stations.length > 1 && currentStation) {
        while(stations[idx].id === currentStation.id) {
          idx = Math.floor(Math.random() * stations.length);
        }
      }
      playStation(idx);
    }

    async function playStation(idx){
      const st = stations[idx];
      if(!st) return;

      if(hasActivePlayback()) stopPlayback({ keepStatus: true });
      
      // Init Audio Context on user action
      if(!audioCtx) initAudioContext();
      if(audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      appState = STATEPLAY;
      currentStation = st;
      playbackActive = true;
      userPausedPlayback = false;
      reconnectAttempts = 0;
      lastReconnectMessageAt = 0;
      clearReconnectTimer();
      setStreamState("CONNECTING");
      setLastStationId(st.id);
      updatePathDisplay();
      refreshStationHighlight();
      updateStatus();

      print(`Initializing uplink to <span class="c-vis">${escapeHtml(st.name)}</span>...`, "c-dim");
      if(st.description){
        const genre = st.genre ? `<span class="c-dim">[${escapeHtml(st.genre)}]</span> ` : "";
        print(`${genre}${escapeHtml(st.description)}`);
      }

      let url = st.streamUrl;
      if(hls) { hls.destroy(); hls=null; }
      
      if(url.endsWith(".pls") || url.endsWith(".m3u")) {
         url = IS_ANDROID_APP
           ? `https://ice2.somafm.com/${st.id}-128-mp3`
           : `https://ice2.somafm.com/${st.id}-128-aac`;
      }
      currentStreamUrl = url;
      triedStreamUrls = [currentStreamUrl];
      currentStreamInfo = parseStreamInfo(url);
      updateTelemetry();

      if(url.includes(".m3u8") && Hls.isSupported()){
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(audioPlayer);
      } else {
        audioPlayer.src = url;
      }
      audioPlayer.volume = volume;
      
      audioPlayer.play().then(()=>{
         print(`Connection established.`, "c-dim");
         playbackStartedAt = Date.now();
         setStreamState("ONLINE");
         startRadioKeepAlive();
         
         // Start visualizer
         isVisRunning = true;
         drawVisualizer();
         
         if(supportsNowPlaying(st)) startPolling(st.id);
         else {
           stopMetadata();
           lastNowPlayingText = "";
           startIcyMetadata(st, currentStreamUrl);
         }
         updateStatus();
      }).catch(e=>{
         print(`Connection failed: ${e.message}`, "c-err");
         const next = nextStreamUrl(st);
         if(!next) {
            reconnectAttempts += 1;
            scheduleReconnect(`connection failed`, 1200);
            updateStatus();
            return;
         }
         print(`Retrying with alternate freq: ${next}`, "c-dim");
         triedStreamUrls.push(currentStreamUrl);
         currentStreamUrl = next;
         audioPlayer.src = next;
         currentStreamInfo = parseStreamInfo(next);
         setStreamState("CONNECTING");
         audioPlayer.play().then(() => {
            playbackStartedAt = Date.now();
            setStreamState("ONLINE");
            startRadioKeepAlive();
            isVisRunning = true;
            drawVisualizer();
            if(supportsNowPlaying(st)) startPolling(st.id);
            else {
              stopMetadata();
              lastNowPlayingText = "";
              startIcyMetadata(st, currentStreamUrl);
            }
            updateStatus();
         }).catch(err => {
            stopPlayback();
            print(`Backup failed: ${err.message}`, "c-err");
            updateStatus();
         });
      });
    }

    function stopPlayback(opts={}){
      stopRadioKeepAlive();
      clearPauseRecoveryTimer();
      clearReconnectTimer();
      isVisRunning = false;
      playbackActive = false;
      userPausedPlayback = false;
      playbackStartedAt = null;
      currentStreamInfo = "";
      currentStreamUrl = "";
      streamState = "OFFLINE";
      suppressPauseRecovery = true;
      audioPlayer.pause();
      suppressPauseRecovery = false;
      audioPlayer.src = "";
      if(hls) { hls.destroy(); hls=null; }
      stopMetadata();
      
      lastTrackPrinted = "";
      lastNowPlayingText = "";
      if(!opts.keepStatus) {
        currentStation = null;
        refreshStationHighlight();
        if(appState === STATEPLAY) appState = STATEPROMPT;
        updatePathDisplay();
      }
      updateTelemetry();
    }

    function recoverUnexpectedPause(reason){
      if(!hasActivePlayback() || userPausedPlayback) return;
      reconnectCurrentStream(reason);
    }

    function clearPauseRecoveryTimer(){
      if(pauseRecoveryTimer){
        clearTimeout(pauseRecoveryTimer);
        pauseRecoveryTimer = null;
      }
    }

    function clearReconnectTimer(){
      if(reconnectTimer){
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
    }

    function scheduleUnexpectedPauseRecovery(reason){
      if(!hasActivePlayback() || userPausedPlayback || suppressPauseRecovery) return;
      clearPauseRecoveryTimer();
      pauseRecoveryTimer = setTimeout(() => {
        pauseRecoveryTimer = null;
        if(!hasActivePlayback() || userPausedPlayback || suppressPauseRecovery) return;
        if(!audioPlayer.paused) return;
        recoverUnexpectedPause(reason);
      }, 1600);
    }

    function printReconnectNotice(reason){
      const now = Date.now();
      if(now - lastReconnectMessageAt < 30000) return;
      lastReconnectMessageAt = now;
      print(`Signal retry: ${reason}. Reopening stream...`, "c-dim");
    }

    function scheduleReconnect(reason, delay){
      if(!hasActivePlayback() || userPausedPlayback) return;
      if(reconnectTimer || reconnectInFlight) return;
      const wait = typeof delay === "number"
        ? delay
        : Math.min(10000, 1200 + reconnectAttempts * 1800);
      setStreamState("BUFFERING");
      printReconnectNotice(reason);
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        reconnectCurrentStream(reason);
      }, wait);
    }

    function reconnectCurrentStream(reason){
      if(!hasActivePlayback() || !currentStreamUrl || reconnectInFlight || userPausedPlayback) return;
      clearPauseRecoveryTimer();
      clearReconnectTimer();
      reconnectInFlight = true;
      setStreamState("CONNECTING");
      logAudioDebug(`reconnect:${reason}`);

      const reconnectUrl = getReconnectUrl();
      suppressPauseRecovery = true;
      audioPlayer.pause();

      if(hls) { hls.destroy(); hls = null; }
      if(currentStreamUrl.includes(".m3u8") && Hls.isSupported()){
        hls = new Hls();
        hls.loadSource(reconnectUrl);
        hls.attachMedia(audioPlayer);
      } else {
        audioPlayer.removeAttribute("src");
        audioPlayer.src = reconnectUrl;
      }

      audioPlayer.volume = volume;
      audioPlayer.muted = isMuted;
      audioPlayer.load();
      suppressPauseRecovery = false;

      audioPlayer.play().then(()=>{
        reconnectInFlight = false;
        reconnectAttempts = 0;
        if(!playbackStartedAt) playbackStartedAt = Date.now();
        isVisRunning = true;
        drawVisualizer();
        setStreamState("ONLINE");
        startRadioKeepAlive();
      }).catch(() => {
        reconnectInFlight = false;
        if(!hasActivePlayback()) return;
        if(!audioPlayer.paused){
          reconnectAttempts = 0;
          setStreamState("ONLINE");
          updateStatus();
          return;
        }
        reconnectAttempts += 1;
        setStreamState("BUFFERING");
        isVisRunning = false;
        scheduleReconnect(reason);
        updateStatus();
      });
    }

    function recoverStreamError(){
      if(!hasActivePlayback()) return;
      clearPauseRecoveryTimer();
      const code = audioPlayer.error ? audioPlayer.error.code : 0;

      if(reconnectInFlight) {
        scheduleReconnect(`media error ${code || ""}`.trim());
        return;
      }

      const next = (code === 3 || code === 4) ? nextStreamUrl(currentStation) : "";
      if(!next) {
        reconnectAttempts += 1;
        scheduleReconnect(`media error ${code || ""}`.trim(), 800);
        return;
      }

      reconnectInFlight = true;
      setStreamState("CONNECTING");
      logAudioDebug(`fallback:${next}`);
      print(`Signal decode error. Trying alternate freq: ${next}`, "c-dim");

      triedStreamUrls.push(currentStreamUrl);
      currentStreamUrl = next;
      currentStreamInfo = parseStreamInfo(next);
      suppressPauseRecovery = true;
      audioPlayer.pause();
      if(hls) { hls.destroy(); hls = null; }
      audioPlayer.src = cacheBustUrl(next);
      audioPlayer.volume = volume;
      audioPlayer.muted = isMuted;
      audioPlayer.load();
      suppressPauseRecovery = false;
      updateTelemetry();

      audioPlayer.play().then(()=>{
        reconnectInFlight = false;
        if(!playbackStartedAt) playbackStartedAt = Date.now();
        isVisRunning = true;
        drawVisualizer();
        setStreamState("ONLINE");
        startRadioKeepAlive();
        updateStatus();
      }).catch(() => {
        reconnectInFlight = false;
        setStreamState("PAUSED");
        print("MP3 backup hold. Tap PLAY to resume.", "c-dim");
        updateStatus();
      });
    }

    function publishNowPlaying(txt){
      if(!txt || txt === lastNowPlayingText) return;
      lastNowPlayingText = txt;
      updateStatus();
      startRadioKeepAlive();

      if(txt !== lastTrackPrinted){
        lastTrackPrinted = txt;
        print(
          `<div class="track-highlight clickable" onclick="copyTrack(this)" data-track="${escapeAttr(txt)}">&#9834; ${escapeHtml(txt)}</div>`
        );
      }
    }

    function parseIcyStreamTitle(meta){
      const match = meta.match(/StreamTitle='([^']*)'/i) || meta.match(/StreamTitle="([^"]*)"/i);
      if(!match) return "";
      return match[1]
        .replace(/\s+/g, " ")
        .replace(/^[-\s]+|[-\s]+$/g, "")
        .trim();
    }

    async function startIcyMetadata(st, url){
      stopIcyMetadata();
      if(!supportsIcyMetadata(st, url)) return;

      const token = ++icyMetadataToken;
      const controller = new AbortController();
      icyMetadataController = controller;

      try {
        const r = await fetch(url, {
          headers: { "Icy-MetaData": "1" },
          cache: "no-store",
          signal: controller.signal
        });
        const metaint = Number(r.headers.get("icy-metaint"));
        if(token !== icyMetadataToken || !r.body || !metaint) return;

        const reader = r.body.getReader();
        let bytesUntilMeta = metaint;
        let pendingMeta = [];
        let pendingMetaRemaining = 0;

        while(token === icyMetadataToken){
          const chunk = await reader.read();
          if(chunk.done) break;
          let offset = 0;
          const data = chunk.value;

          while(offset < data.length && token === icyMetadataToken){
            if(pendingMetaRemaining > 0){
              const take = Math.min(pendingMetaRemaining, data.length - offset);
              pendingMeta.push(data.slice(offset, offset + take));
              offset += take;
              pendingMetaRemaining -= take;

              if(pendingMetaRemaining === 0){
                const metaBytes = new Uint8Array(pendingMeta.reduce((sum, part) => sum + part.length, 0));
                let pos = 0;
                pendingMeta.forEach(part => {
                  metaBytes.set(part, pos);
                  pos += part.length;
                });
                pendingMeta = [];
                const meta = decodeIcyMetadataBytes(metaBytes);
                const title = parseIcyStreamTitle(meta);
                if(title) publishNowPlaying(title);
                bytesUntilMeta = metaint;
              }
              continue;
            }

            if(bytesUntilMeta > 0){
              const skip = Math.min(bytesUntilMeta, data.length - offset);
              offset += skip;
              bytesUntilMeta -= skip;
              continue;
            }

            const metaLength = data[offset] * 16;
            offset += 1;
            if(metaLength === 0){
              bytesUntilMeta = metaint;
              continue;
            }
            pendingMetaRemaining = metaLength;
          }
        }
      } catch(e) {
        if(debugMode && e.name !== "AbortError") {
          print(`icy: ${escapeHtml(e.message)}`, "c-dim");
        }
      }
    }

    function stopIcyMetadata(){
      icyMetadataToken++;
      if(icyMetadataController){
        icyMetadataController.abort();
        icyMetadataController = null;
      }
    }

    function stopMetadata(){
      stopPolling();
      stopIcyMetadata();
    }

    // --- POLLING ---
    function startPolling(id){
      stopMetadata();
      const pollToken = ++nowPlayingPollToken;
      const tick = async () => {
        try {
          if(pollToken !== nowPlayingPollToken) return;
          const r = await fetch(SOMA_SONGS_URL(id));
          const d = await r.json();
          if(pollToken !== nowPlayingPollToken || !currentStation || currentStation.id !== id) return;
          const s = d.songs[0];
          const txt = `${s.artist} — ${s.title}`;
          
          if(txt && txt !== lastNowPlayingText){
             lastNowPlayingText = txt;
             updateStatus();
             
             if(txt !== lastTrackPrinted){
               lastTrackPrinted = txt;
               print(
                 `<div class="track-highlight clickable" onclick="copyTrack(this)" data-track="${escapeAttr(txt)}">♪ ${escapeHtml(txt)}</div>`
               );
             }
          }
        } catch(e) { }
      };
      tick();
      nowPlayingTimer = setInterval(tick, 15000);
    }

    function stopPolling(){
      clearInterval(nowPlayingTimer);
      nowPlayingTimer = null;
      nowPlayingPollToken++;
    }

    // --- INIT ---
    window.onload = async () => {
      if("scrollRestoration" in history) history.scrollRestoration = "manual";
      autoScrollOutput = false;
      stations = await loadStations();
      print(`Loaded ${stations.length} channels.`);
      renderList();
      printLastStationHint();
      updateVolumeUi();
      updateTelemetry();
      setInterval(updateTelemetry, 1000);
      requestAnimationFrame(() => {
        scrollToTop();
        autoScrollOutput = true;
      });
      focusCommandInput();
    };

    // --- EVENTS ---
    inputField.addEventListener("input", () => {
      typedDisplay.innerText = inputField.value;
      scrollToBottom();
    });

    inputField.addEventListener("keydown", (e) => {
      if(e.key === "Enter") execInput();
      else if(e.key === " " && hasActivePlayback()) {
        e.preventDefault();
        uiExec("space");
      } else if(e.key === "Escape") {
        e.preventDefault();
        uiExec("home");
      }
    });

    audioPlayer.addEventListener("waiting", () => {
      logAudioDebug("waiting");
      if(hasActivePlayback() && !audioPlayer.paused) setStreamState("BUFFERING");
    });
    audioPlayer.addEventListener("stalled", () => {
      logAudioDebug("stalled");
      if(hasActivePlayback() && !audioPlayer.paused) setStreamState("BUFFERING");
    });
    audioPlayer.addEventListener("playing", () => {
      logAudioDebug("playing");
      clearPauseRecoveryTimer();
      clearReconnectTimer();
      reconnectInFlight = false;
      reconnectAttempts = 0;
      if(hasActivePlayback()) setStreamState("ONLINE");
      if(hasActivePlayback() && !userPausedPlayback) startRadioKeepAlive();
    });
    audioPlayer.addEventListener("pause", () => {
      logAudioDebug("pause");
      if(suppressPauseRecovery) return;
      if(!hasActivePlayback()) return;
      if(userPausedPlayback) setStreamState("PAUSED");
      else scheduleUnexpectedPauseRecovery("unexpected pause");
    });
    audioPlayer.addEventListener("error", () => {
      logAudioDebug("error");
      if(hasActivePlayback()) recoverStreamError();
    });
    audioPlayer.addEventListener("ended", () => {
      logAudioDebug("ended");
      recoverUnexpectedPause("stream ended");
    });

    document.addEventListener("keydown", (e) => {
      if(e.target === inputField) return;
      if(e.key === "ArrowRight") {
        e.preventDefault();
        moveTvFocus(1);
      } else if(e.key === "ArrowLeft") {
        e.preventDefault();
        moveTvFocus(-1);
      } else if(e.key === "ArrowDown") {
        e.preventDefault();
        moveTvFocusVertical(1);
      } else if(e.key === "ArrowUp") {
        e.preventDefault();
        moveTvFocusVertical(-1);
      } else if(e.key === "Enter") {
        e.preventDefault();
        activateTvFocus();
      } else if((e.key === " " || e.key === "MediaPlayPause") && hasActivePlayback()) {
        e.preventDefault();
        uiExec("space");
      } else if(e.key === "Escape" || e.key === "Backspace" || e.key === "BrowserBack"){
        e.preventDefault();
        uiExec("home");
      }
      else if(e.key.length === 1 && !e.ctrlKey && !e.altKey){ focusCommandInput(); }
    });

    if(window.Capacitor?.Plugins?.App){
      window.Capacitor.Plugins.App.addListener("backButton", () => {
        if(appState !== STATELIST) uiExec("home");
      });
    }
    
    document.addEventListener("click", (e)=>{
      if(!e.target.closest("#status-bar") && !e.target.closest(".clickable")) focusCommandInput();
    });

    if("serviceWorker" in navigator && location.protocol === "https:"){
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
