name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            releases/SomaFMCore-player-release.apk \
            --title "SomaFM Core $GITHUB_REF_NAME" \
            --notes "Android APK release for SomaFM Core. The browser build is available at https://domrique.github.io/somafm-core/."
